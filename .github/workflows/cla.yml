name: CLA

# Asks every new contributor to accept CLA.md once, by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Pull requests the maintainer opens from a branch of this repository need no CLA: only he can
    # open them, and they include the commits Claude makes in his sessions. This is checked by the
    # GitHub account that opened the pull request, which cannot be faked (commit names can).
    if: >-
      ${{ !(
        (github.event.pull_request.user.login == 'amaninakis' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.issue.user.login == 'amaninakis'
      ) && (
        github.event_name == 'pull_request_target' ||
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      ) }}
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/amaninakis/olive-harvest/blob/main/CLA.md
          branch: cla-signatures
          # No allowlist: anyone can put any name or email on a commit, so names prove nothing.
          # Who may skip the CLA is decided above, by the account that opened the pull request.
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read the
            [Contributor Licence Agreement](https://github.com/amaninakis/olive-harvest/blob/main/CLA.md)
            and accept it by commenting with the sentence below. You only need to do this once.
