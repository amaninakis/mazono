name: CLA

# Asks every new contributor to accept CLA.md once, by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/amaninakis/olive-harvest/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer owns his code, and the commits Claude makes for him are his.
          allowlist: amaninakis,Claude,dependabot[bot],*[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read the
            [Contributor Licence Agreement](https://github.com/amaninakis/olive-harvest/blob/main/CLA.md)
            and accept it by commenting with the sentence below. You only need to do this once.
