name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Start the image and check that it answers, before publishing it
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mazono:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check that the server starts
        run: |
          docker run -d --name mazono-check -p 8080:8080 mazono:check
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/status; then
              curl -fsS http://localhost:8080/ | grep -q '<div id="root"' && exit 0
            fi
            sleep 1
          done
          docker logs mazono-check
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest
