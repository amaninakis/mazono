# Mazono: the app, sign-in and sync. Data (and 14 daily backups) live in the mazono_data
# volume, at /data inside the container.
#
# Home lab / private use (reach it through Tailscale):
#   docker compose up -d
#   tailscale serve --bg 8080        # gives you https://<machine>.<tailnet>.ts.net
#
# On the first start the log shows the setup code and where to open the app:
#   docker compose logs mazono
#
# Public server with your own domain and automatic HTTPS (Caddy in front):
#   SITE_ADDRESS=harvest.example.com docker compose --profile https up -d
#
# Optional settings, in a .env file next to this one:
#   MAZONO_PORT=8080                        the port on this computer (8080)
#   MAZONO_URL=https://elies.example.org    the address people open, shown in the log
#   MAZONO_DATA_VOLUME=my_existing_volume   keep the data in a Docker volume you already have

name: mazono

services:
  mazono:
    build: .
    image: mazono:latest
    restart: unless-stopped
    ports:
      - "${MAZONO_PORT:-8080}:8080"
    environment:
      MAZONO_PORT: ${MAZONO_PORT:-8080}
      MAZONO_URL: ${MAZONO_URL:-}
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mazono

volumes:
  data:
    name: ${MAZONO_DATA_VOLUME:-mazono_data}
  caddy_data:
    name: ${MAZONO_CADDY_VOLUME:-mazono_caddy_data}
