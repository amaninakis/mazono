# Mazono: the app, sign-in and sync. Data (and 14 daily backups) live in the mazono_data
# volume, at /data inside the container.
#
# Home lab / private use (reach it through Tailscale):
#   docker compose up -d
#   tailscale serve --bg 8080        # gives you https://<machine>.<tailnet>.ts.net
#
# Public server with your own domain and automatic HTTPS (Caddy in front):
#   SITE_ADDRESS=harvest.example.com docker compose --profile https up -d
#
# Installed before the rename, when the app was called HarvestLog? Keep using your data
# volume by naming it in a .env file next to this one (see "Upgrading from HarvestLog" in
# the README), e.g.:  MAZONO_DATA_VOLUME=olive-harvest_harvestlog_data

name: mazono

services:
  mazono:
    build: .
    image: mazono:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mazono

volumes:
  data:
    name: ${MAZONO_DATA_VOLUME:-mazono_data}
  caddy_data:
    name: ${MAZONO_CADDY_VOLUME:-mazono_caddy_data}
